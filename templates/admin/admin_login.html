{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card p-4 shadow">

        <h2>Admin Login</h2>

        <form method="POST">

            <input type="text"
                   name="username"
                   class="form-control mb-3"
                   placeholder="Username">

            <input type="password"
                   name="password"
                   class="form-control mb-3"
                   placeholder="Password">

            <button class="btn btn-primary w-100">
                Login
            </button>

        </form>

    </div>

</div>

{% endblock %}
