{% extends 'base.html' %}

{% block content %}

<div class="container mt-5 mb-5">

    <div class="id-card">

        <div class="id-header">

            <h3>Vithlam's</h3>

            <p>Member Identity Card</p>

        </div>

        <div class="id-body">

            <img src="{{ url_for('static',
            filename='uploads/users/' + (user.profile_photo or 'default.png')) }}"
            class="id-photo">

            <h4>{{ user.full_name }}</h4>

            <table class="table table-borderless">

                <tr>
                    <th>Member ID</th>
                    <td>{{ user.member_id }}</td>
                </tr>

                <tr>
                    <th>Mobile</th>
                    <td>{{ user.mobile }}</td>
                </tr>

                <tr>
                    <th>Email</th>
                    <td>{{ user.email }}</td>
                </tr>

                <tr>
                    <th>State</th>
                    <td>{{ user.state }}</td>
                </tr>

                <tr>
                    <th>City</th>
                    <td>{{ user.city }}</td>
                </tr>

            </table>

        </div>

        <div class="id-footer">

            <small>
                This card is the property of Vithlam's.
            </small>

        </div>

    </div>

</div>

{% endblock %}
