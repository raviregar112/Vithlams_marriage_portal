{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="profile-card">

        <h2 class="text-center mb-4">
            Edit Profile
        </h2>

        <form method="POST">

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label>Member ID</label>

                    <input
                    type="text"
                    class="form-control"
                    value="{{ user.member_id }}"
                    readonly>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Full Name</label>

                    <input
                    type="text"
                    name="full_name"
                    class="form-control"
                    value="{{ user.full_name }}"
                    required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Mobile</label>

                    <input
                    type="text"
                    name="mobile"
                    class="form-control"
                    value="{{ user.mobile }}"
                    required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>Email</label>

                    <input
                    type="email"
                    name="email"
                    class="form-control"
                    value="{{ user.email }}"
                    required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>State</label>

                    <input
                    type="text"
                    name="state"
                    class="form-control"
                    value="{{ user.state }}"
                    required>

                </div>

                <div class="col-md-6 mb-3">

                    <label>City</label>

                    <input
                    type="text"
                    name="city"
                    class="form-control"
                    value="{{ user.city }}"
                    required>

                </div>

            </div>

            <div class="text-center">

                <button class="btn btn-success px-5">

                    Save Changes

                </button>

            </div>

        </form>

    </div>

</div>

{% endblock %}
