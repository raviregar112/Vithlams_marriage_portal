{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card shadow border-0 rounded-4">

<div class="card-body p-5">

<div class="text-center">

<img
class="profile-image"
src="{{ url_for('static',
filename='uploads/users/' + (user.profile_photo or 'default.png')) }}">

 <form method="POST"
          action="/upload-profile-photo"
          enctype="multipart/form-data"
          class="mt-3">

        <input type="file"
               name="photo"
               class="form-control mb-3"
               accept=".jpg,.jpeg,.png,.webp"
               required>

        <button type="submit"
                class="btn btn-primary">

            📷 Upload Photo

        </button>

    </form>

<h3 class="mt-3">

{{ user.full_name }}

</h3>

<p class="text-muted">

Member ID :
<b>{{ user.member_id }}</b>

</p>

</div>

<hr>

<div class="row">

<div class="col-md-6 mb-3">

<label><b>📱 Mobile</b></label>

<p>{{ user.mobile }}</p>

</div>

<div class="col-md-6 mb-3">

<label><b>📧 Email</b></label>

<p>{{ user.email }}</p>

</div>

<div class="col-md-6 mb-3">

<label><b>🗺️ State</b></label>

<p>{{ user.state }}</p>

</div>

<div class="col-md-6 mb-3">

<label><b>🏙️ City</b></label>

<p>{{ user.city }}</p>

</div>

<div class="col-md-6 mb-3">

<label><b>✅ Status</b></label>

<p>{{ user.status }}</p>

</div>

</div>

<hr>

<div class="text-center">

<a href="/edit-profile"
class="btn btn-primary">

✏️ Edit Profile

</a>

<a href="/id-card"
class="btn btn-success">

🪪 My ID Card

</a>

</div>

</div>

</div>

</div>

</div>

</div>

{% endblock %}
