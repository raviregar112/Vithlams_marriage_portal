<!DOCTYPE html>
<html>
<head>
    <title>Vithlam's Society</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css">

<link rel="stylesheet"href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
<!-- ================= HEADER ================= -->

<header class="mobile-header">

    <div class="menu-icon">
        <i class="fa-solid fa-bars"></i>
    </div>

    <a href="/" class="header-brand text-decoration-none">

        <img src="{{ url_for('static', filename='images/logo.png') }}"
             class="header-logo">

        <div>
            <h6>Vithlam's Society LLP</h6>

        </div>

    </a>

    <div class="header-right">

        {% if 'user_id' in session %}

        <div class="dropdown">

            <a href="#"
               data-bs-toggle="dropdown">

                <img
                class="header-profile"
                src="{{ url_for('static',
                filename='uploads/users/' + (session.get('profile_photo') or 'default.png')) }}">

            </a>

            <ul class="dropdown-menu dropdown-menu-end shadow">

                <li><a class="dropdown-item" href="/profile">👤 My Profile</a></li>

                <li><a class="dropdown-item" href="/my-marriage-profile">💍 My Marriage Profile</a></li>

                <li><a class="dropdown-item" href="/add-marriage">➕ Add Marriage Profile</a></li>

                <li><a class="dropdown-item" href="/id-card">🪪 My ID Card</a></li>

                <li><a class="dropdown-item" href="/change-password">🔑 Change Password</a></li>

                <li><hr class="dropdown-divider"></li>

                <li><a class="dropdown-item text-danger" href="/logout">Logout</a></li>

            </ul>

        </div>

        {% else %}

        <a href="/login" class="header-btn login-small">
            Login
        </a>

        <a href="/register" class="header-btn register-small">
            Register
        </a>

        {% endif %}

    </div>

</header>

{% block content %}
{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>
</html>
