<script>

//==============================
// STEPS
//==============================

const steps=[
document.getElementById("step1"),
document.getElementById("step2"),
document.getElementById("step3"),
document.getElementById("step4")
];

const circles=document.querySelectorAll(".step");

const progress=document.getElementById("progressBar");

let currentStep=0;

function showStep(index){

steps.forEach(function(step){

step.style.display="none";

});

steps[index].style.display="block";

progress.style.width=((index+1)*25)+"%";

circles.forEach(function(circle){

circle.classList.remove("active");

});

for(let i=0;i<=index;i++){

circles[i].classList.add("active");

}

currentStep=index;

}

showStep(0);


//==============================
// NEXT BUTTONS
//==============================

document.getElementById("next1").onclick=function(){

showStep(1);

}

document.getElementById("next2").onclick=function(){

showStep(2);

}

document.getElementById("next3").onclick=function(){

showStep(3);

}


//==============================
// PREVIOUS BUTTONS
//==============================

document.getElementById("previous1").onclick=function(){

showStep(0);

}

document.getElementById("previous2").onclick=function(){

showStep(1);

}

document.getElementById("previous3").onclick=function(){

showStep(2);

}


//==============================
// AGE CALCULATE
//==============================

document.getElementById("dob").addEventListener("change",function(){

let dob=new Date(this.value);

let today=new Date();

let age=today.getFullYear()-dob.getFullYear();

let m=today.getMonth()-dob.getMonth();

if(m<0 || (m===0 && today.getDate()<dob.getDate())){

age--;

}

document.getElementById("age").value=age+" Years";

});


//==============================
// IMAGE PREVIEW
//==============================

document.getElementById("profileImage").addEventListener("change",function(e){

const reader=new FileReader();

reader.onload=function(){

document.getElementById("photoPreview").src=reader.result;

}

reader.readAsDataURL(e.target.files[0]);

});

</script>
